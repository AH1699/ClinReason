[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectorbench"
version = "0.1.0"
description = "Local-first scaffold for sector-specific LLM benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sectorbench = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.unittest]
start-directory = "tests"
